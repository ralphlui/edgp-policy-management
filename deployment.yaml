apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgp-app-policy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edgp-app-policy
  template:
    metadata:
      labels:
        app: edgp-app-policy
    spec:
      containers:
        - name: edgp-app-policy
          image: public.ecr.aws/q1b5w5y6/edgp-app-policy:VERSION
          imagePullPolicy: Always
          ports:
            - containerPort: 8089
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: AWS_REGION
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: SPRING_PROFILES_ACTIVE
            - name: AUDIT_SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: AUDIT_SQS_URL
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: FRONTEND_URL
            - name: ADMIN_URL
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: ADMIN_URL
            - name: ORGANIZATION_URL
              valueFrom:
                configMapKeyRef:
                  name: my-configmap
                  key: ORGANIZATION_URL
            - name: aws_access_key_id
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: aws_edgp_access_key_id
            - name: aws_secret_key_id
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: aws_edgp_secret_key_id
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: aws_edgp_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: aws_edgp_secret_key_id
          resources:
           requests:
             cpu: "50m"
             memory: "250Mi"
           limits:
             cpu: "350m"
             memory: "500Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: policy-k8s-service
spec:
  selector:
    app: edgp-app-policy
  ports:
    - protocol: TCP
      port: 8089
      targetPort: 8089
  type: NodePort
